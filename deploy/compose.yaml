# Бот регистрации КД на сервере: бот, база и контейнер копий.
# Служба мессенджера живет в своем compose; связь — через общую сеть Docker (MESSENGER_NETWORK).
# Все настройки установки — в .env рядом с этим файлом (образец: .env.example).
name: doc-registry-bot

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doc_registry}
      POSTGRES_USER: ${POSTGRES_USER:-doc_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: Europe/Moscow
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    image: doc-registry-bot:${BOT_VERSION:?задайте BOT_VERSION в .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MESSENGER_URL: ${MESSENGER_URL:?задайте MESSENGER_URL в .env}
      OWNER_IDS: ${OWNER_IDS:?задайте OWNER_IDS в .env}
      ORG_CODES: ${ORG_CODES:?задайте ORG_CODES в .env}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-doc_registry}
      POSTGRES_USER: ${POSTGRES_USER:-doc_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_STATUS_FILE: /backups/status.json
      TIME_ZONE: Europe/Moscow
      TZ: Europe/Moscow
      # Папки для копий: бот только показывает их в чате, писать в них может контейнер копий.
      BACKUP_DIR_1: ${BACKUP_DIR_1:-./backups}
      BACKUP_DIR_1_NAME: ${BACKUP_DIR_1_NAME:-Основная}
      BACKUP_DIR_2: ${BACKUP_DIR_2:-}
      BACKUP_DIR_2_NAME: ${BACKUP_DIR_2_NAME:-Папка 2}
      BACKUP_DIR_3: ${BACKUP_DIR_3:-}
      BACKUP_DIR_3_NAME: ${BACKUP_DIR_3_NAME:-Папка 3}
      BACKUP_SHARE: ${BACKUP_SHARE:-}
      BACKUP_SHARE_NAME: ${BACKUP_SHARE_NAME:-Сетевая папка}
      BACKUP_REMINDER_DAY: ${BACKUP_REMINDER_DAY:-пн}
      BACKUP_REMINDER_TIME: ${BACKUP_REMINDER_TIME:-10:00}
      BACKUP_REMINDER_ZONE: ${BACKUP_REMINDER_ZONE:-}
      # Папка бота на компьютере (пишут update.sh и backup.sh): для показа пути ./backups.
      BOT_DIR: ${BOT_DIR:-}
    volumes:
      - backups:/backups:ro
    networks:
      - default
      - messenger

  backup:
    image: doc-registry-backup:${BOT_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-doc_registry}
      PGDATABASE: ${POSTGRES_DB:-doc_registry}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Для образа копий прежних версий (до 1.2.0, например после отката): его ночная копия
      # удаляла копии старше BACKUP_KEEP_DAYS дней. Нынешний образ эти строки не читает.
      BACKUP_KEEP_DAYS: "36500"
      BACKUP_TIME: "03:00"
      BACKUP_DIR_1: ${BACKUP_DIR_1:-./backups}
      BACKUP_DIR_2: ${BACKUP_DIR_2:-}
      BACKUP_DIR_3: ${BACKUP_DIR_3:-}
      BOT_DIR: ${BOT_DIR:-}
      BACKUP_SHARE: ${BACKUP_SHARE:-}
      BACKUP_SHARE_USER: ${BACKUP_SHARE_USER:-}
      BACKUP_SHARE_PASSWORD: ${BACKUP_SHARE_PASSWORD:-}
      BACKUP_SHARE_DOMAIN: ${BACKUP_SHARE_DOMAIN:-}
      TZ: Europe/Moscow
    volumes:
      # Защитные копии перед обновлением (update.sh) и восстановление (update.sh --restore).
      - backups:/backups
      # Копии из терминала (./backup.sh): папка backups рядом с этим файлом.
      - ./backups:/copies/0
      # Папки для копий из чата. Других папок компьютера контейнер не видит. Незаданная папка
      # подключается пустым томом Docker и в чате не предлагается.
      - ${BACKUP_DIR_1:-./backups}:/copies/1
      - ${BACKUP_DIR_2:-copies-2}:/copies/2
      - ${BACKUP_DIR_3:-copies-3}:/copies/3

volumes:
  db-data:
  backups:
  copies-2:
  copies-3:

networks:
  messenger:
    external: true
    name: ${MESSENGER_NETWORK:-messenger}
