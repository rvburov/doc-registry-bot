name: Проверки

on:
  push:
  pull_request:

jobs:
  checks:
    name: Оформление, типы, тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5457:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5457/drb_test
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
      - name: Зависимости
        run: uv sync --frozen
      - name: Оформление
        run: uv run ruff format --check .
      - name: Стиль и одна дверь в сеть
        run: uv run ruff check .
      - name: Типы
        run: uv run mypy
      - name: Тесты
        run: uv run pytest -q -rs | tee pytest.log
        shell: bash -o pipefail {0}
      - name: Тесты базы не пропущены
        run: "! grep -q SKIPPED pytest.log"

  images:
    name: Сборка образов
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Образ бота
        run: docker build -t "doc-registry-bot:$VERSION" .
      - name: Образ копии
        run: docker build -t "doc-registry-backup:$VERSION" deploy/backup
      - name: Бот запускается
        run: test "$(docker run --rm "doc-registry-bot:$VERSION" version)" = "$VERSION"
      - name: Скрипты без синтаксических ошибок
        run: for f in scripts/*.sh deploy/*.sh deploy/backup/backup.sh; do bash -n "$f"; done
      # Файл для установки (как у scripts/build.sh) в Releases, тег v<версия>: его скачивает
      # scripts/download.sh на ПК без доступа к каталогу библиотек Python. Только для master;
      # та же версия после новых правок заменяет файл.
      - name: Файл для установки
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker pull postgres:16
          mkdir -p dist
          name="doc-registry-bot-$VERSION.tar.gz"
          docker save "doc-registry-bot:$VERSION" "doc-registry-backup:$VERSION" postgres:16 | gzip > "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Регистрация КД $VERSION" \
              --notes "Файл для установки: scripts/download.sh, затем deploy/update.sh (docs/pc.md)."
          gh release upload "v$VERSION" "dist/$name" "dist/$name.sha256" --clobber
