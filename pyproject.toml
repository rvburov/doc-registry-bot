[project]
name = "doc-registry-bot"
version = "1.2.3"
description = "Регистрация КД: бот в программе-мессенджере выдает обозначения по ГОСТ 2.201-80 и ведет журнал"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.2",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
]

[project.scripts]
doc-registry-bot = "doc_registry_bot.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_registry_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID", "ASYNC", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR0911",  # много выходов из функции: разбор сообщений так читается проще
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",  # числа в проверках формата (4 буквы, 6 цифр) понятнее как есть
    "RUF001",   # кириллица в строках — норма
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Сеть — только в doc_registry_bot.messenger"
"websockets".msg = "Сеть — только в doc_registry_bot.messenger"
"socket".msg = "Сеть — только в doc_registry_bot.messenger"
"urllib.request".msg = "Сеть — только в doc_registry_bot.messenger"
"requests".msg = "Сеть — только в doc_registry_bot.messenger"
"http.client".msg = "Сеть — только в doc_registry_bot.messenger"

[tool.ruff.lint.per-file-ignores]
"src/doc_registry_bot/messenger/**" = ["TID251"]
"tests/fake_messenger/**" = ["TID251"]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
